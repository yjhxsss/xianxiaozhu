<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cf8"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcd8ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="30" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="78" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="26" fill="#ffffff"/>
  </g>

  <g opacity="0.6">
    <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 10" opacity="0.5"/>
  </g>
</svg>